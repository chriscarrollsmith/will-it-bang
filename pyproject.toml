    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "torch>=2.2",
    "transformers>=4.40",
    "vadersentiment>=3.3.2",
]
